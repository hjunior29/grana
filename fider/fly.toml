app = "gra-na-fider"
primary_region = "gru"

[build]
  image = "getfider/fider:stable"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[env]]
  BASE_URL = "https://roadmap.grana.vertices.me"

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/_health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
