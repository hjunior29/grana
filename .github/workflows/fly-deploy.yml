# Pipeline de CI/CD do Grana.
#
# Cada verificação do quality gate é um JOB separado (📦 deps, 🎨 format,
# 🔨 compile, 🔎 credo, 🛡️ audit, 🧪 test) para ficar visível no GitHub Actions
# exatamente o que está rodando e o que falhou — em vez de um job monolítico.
#
# `✅ Quality gate` agrega todas as verificações num único status (bom para exigir
# como check obrigatório em branch protection). `🚀 Deploy` só roda fora de PR:
# em pull_request todo o gate roda, mas o deploy é pulado.
#
#   push/dispatch (main):  deps → [format, compile, credo, audit, test] → gate → deploy
#   pull_request (main):   deps → [format, compile, credo, audit, test] → gate   (sem deploy)
#
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: CI

on:
  workflow_dispatch: # permite disparo manual pela UI do GitHub
  push:
    branches:
      - main
  pull_request: # roda o quality gate completo nas PRs para main (sem deploy)
    branches:
      - main

# Um push novo no mesmo ref cancela o run anterior — mas só em PR. Na main não
# cancelamos (um run em andamento pode estar no meio de um deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"
  # CVE do Decimal (GHSA-rhv4-8758-jx7v) ignorada de propósito: o fix exige
  # decimal 3.0, mas postgrex ainda fixa `decimal ~> 2.0`. Reavaliar quando o
  # postgrex permitir 3.0.
  AUDIT_IGNORE: GHSA-rhv4-8758-jx7v

jobs:
  # ── 📦 Aquece o cache de deps/_build para os jobs seguintes ─────────────────
  deps:
    name: 📦 Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Compilar dependências
        run: mix deps.compile

  # ── 🎨 Formatação ───────────────────────────────────────────────────────────
  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix format --check-formatted

  # ── 🔨 Compilação sem warnings ───────────────────────────────────────────────
  compile:
    name: 🔨 Compile (warnings as errors)
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # --force garante que o código do app seja recompilado (e os warnings
      # apareçam) mesmo com o _build restaurado do cache.
      - run: mix compile --force --warnings-as-errors

  # ── 🔎 Análise estática ──────────────────────────────────────────────────────
  credo:
    name: 🔎 Credo
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix credo --strict

  # ── 🛡️ Dependências: travadas e sem CVEs ──────────────────────────────────────
  audit:
    name: 🛡️ Deps audit
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Sem dependências não usadas no lock
        run: mix deps.unlock --check-unused
      - name: Scan de vulnerabilidades
        run: mix deps.audit --ignore-advisory-ids ${{ env.AUDIT_IGNORE }}

  # ── 🧪 Testes + piso de cobertura ─────────────────────────────────────────────
  test:
    name: 🧪 Test & coverage
    runs-on: ubuntu-latest
    needs: deps
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Roda a suíte E aplica o piso de cobertura (minimum_coverage em coveralls.json).
      - run: mix coveralls

  # ── ✅ Status agregado do quality gate ────────────────────────────────────────
  # Junta todas as verificações num único check. Use ESTE job como status
  # obrigatório em branch protection (em vez de listar cada um).
  quality_gate:
    name: ✅ Quality gate
    runs-on: ubuntu-latest
    needs: [format, compile, credo, audit, test]
    steps:
      - name: Todas as verificações passaram
        run: echo "✅ format + compile + credo + audit + test — quality gate verde."

  # ── 🚀 Deploy (somente fora de PR) ────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: quality_gate
    # Só faz deploy no push/merge para main (ou disparo manual). Em PR o gate
    # roda inteiro, mas o deploy é pulado.
    if: github.event_name != 'pull_request'
    concurrency: deploy-group # garante um único deploy por vez
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
