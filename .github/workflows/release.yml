# Publicação do Grana, disparada por tags `vX.Y.Z`. A tag é a versão: vira GRANA_VERSION
# (sem o "v"), que o mix.exs lê, no tarball e na imagem. Não há versão para editar no código.
#
#   verify  → confere que a tag é uma versão (vX.Y.Z)
#   tarball → release Elixir (linux x86_64 e arm64) + sha256
#   docker  → imagem multi-arch no GHCR
#   release → GitHub Release com os tarballs e os sha256
#
# Compatibilidade dos tarballs: glibc >= 2.35 e OpenSSL 3 (Debian 12+, Ubuntu 22.04+).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"

jobs:
  verify:
    name: Verificar versão
    runs-on: ubuntu-latest
    steps:
      - name: A tag é uma versão
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag ${GITHUB_REF_NAME} não é uma versão (vX.Y.Z)."
            exit 1
          fi

  tarball:
    name: Tarball (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Compilar release
        run: |
          export GRANA_VERSION="${GITHUB_REF_NAME#v}"
          mix deps.get --only prod
          mix assets.deploy
          mix release --overwrite
      - name: Empacotar
        run: |
          NAME="grana-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz"
          cp .env.example _build/prod/rel/grana/env.example
          cp deploy/systemd/grana.service _build/prod/rel/grana/grana.service
          tar -czf "$NAME" -C _build/prod/rel grana
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            grana-*.tar.gz
            grana-*.tar.gz.sha256

  docker:
    name: Imagem Docker
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GRANA_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [tarball, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            grana-*.tar.gz
            grana-*.tar.gz.sha256
