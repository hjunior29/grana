# Pipeline de CI do Grana.
#
# Cada verificação do quality gate é um JOB separado (📦 deps, 🎨 format,
# 🔨 compile, 🔎 credo, 🛡️ audit, 🧪 test) para ficar visível no GitHub Actions
# exatamente o que está rodando e o que falhou — em vez de um job monolítico.
#
# `✅ Quality gate` agrega todas as verificações num único status (bom para exigir
# como check obrigatório em branch protection). `🔥 Release smoke` constrói a
# release de produção e confirma que ela sobe SEM nenhuma variável de ambiente.
# A publicação (tarball e imagem Docker) é do workflow release.yml, em tags v*.
#
#   push/dispatch (main):  deps → [format, compile, credo, audit, test] → gate → smoke
#   pull_request (main):   deps → [format, compile, credo, audit, test] → gate   (sem smoke)

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"

jobs:
  # ── 📦 Aquece o cache de deps/_build para os jobs seguintes ─────────────────
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Compilar dependências
        run: mix deps.compile

  # ── 🎨 Formatação ───────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix format --check-formatted

  # ── 🔨 Compilação sem warnings ───────────────────────────────────────────────
  compile:
    name: Compile (warnings as errors)
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix compile --force --warnings-as-errors

  # ── 🔎 Análise estática ──────────────────────────────────────────────────────
  credo:
    name: Credo
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix credo --strict

  # ── 🛡️ Dependências: travadas e sem CVEs ──────────────────────────────────────
  audit:
    name: Deps audit
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Sem dependências não usadas no lock
        run: mix deps.unlock --check-unused
      - name: Scan de vulnerabilidades
        run: mix deps.audit

  # ── 🧪 Testes + piso de cobertura ─────────────────────────────────────────────
  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Roda a suíte E aplica o piso de cobertura (minimum_coverage em coveralls.json).
      - run: mix coveralls

  # ── ✅ Status agregado do quality gate ────────────────────────────────────────
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [format, compile, credo, audit, test]
    steps:
      - name: Todas as verificações passaram
        run: echo "✅ format + compile + credo + audit + test — quality gate verde."

  # ── 🔥 Release smoke ──────────────────────────────────────────────────────────
  # Constrói a release de PRODUÇÃO e a sobe sem nenhuma variável de ambiente (só o
  # DATA_DIR, num diretório temporário): confirma que o boot gera os segredos, migra
  # o banco, responde em /health, imprime o código do setup no log e que a
  # instância sem dono redireciona tudo para /setup.
  #
  # Só roda fora de PR para não consumir minutos desnecessariamente em branches.
  release-smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    needs: quality_gate
    if: github.event_name != 'pull_request'
    env:
      MIX_ENV: prod
      PORT: "4002"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Compilar assets e release de produção
        run: |
          mix assets.deploy
          mix release --overwrite

      - name: Subir app em background (sem variáveis, só DATA_DIR)
        run: |
          mkdir -p "$RUNNER_TEMP/grana-smoke"
          DATA_DIR="$RUNNER_TEMP/grana-smoke" PHX_SERVER=true \
            _build/prod/rel/grana/bin/grana start > "$RUNNER_TEMP/grana.log" 2>&1 &

      - name: Aguardar /health (até 40 s)
        run: |
          for i in $(seq 1 20); do
            echo "Tentativa $i/20..."
            if curl -sf --max-time 3 http://localhost:4002/health | grep -q '"status":"ok"'; then
              echo "✅ /health respondeu."
              exit 0
            fi
            sleep 2
          done
          echo "❌ App não subiu no prazo de 40 s."
          cat "$RUNNER_TEMP/grana.log" || true
          exit 1

      - name: O log tem o código do setup
        run: |
          grep -E "Código: [A-Z0-9]{4}-[A-Z0-9]{4}" "$RUNNER_TEMP/grana.log"

      - name: Segredos gerados e banco migrado
        run: |
          test -s "$RUNNER_TEMP/grana-smoke/secrets/secret_key_base"
          test -s "$RUNNER_TEMP/grana-smoke/secrets/cloak_key"
          test -s "$RUNNER_TEMP/grana-smoke/grana.db"

      - name: Sem dono, / redireciona para /setup
        run: |
          curl -si --max-time 5 http://localhost:4002/ | tr -d '\r' | grep -iE '^location: .*/setup$'

      - name: Parar app
        if: always()
        run: _build/prod/rel/grana/bin/grana stop || true
