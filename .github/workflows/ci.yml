# Pipeline de CI do Grana.
#
# Cada verificação do quality gate é um JOB separado (📦 deps, 🎨 format,
# 🔨 compile, 🔎 credo, 🛡️ audit, 🧪 test) para ficar visível no GitHub Actions
# exatamente o que está rodando e o que falhou — em vez de um job monolítico.
#
# `✅ Quality gate` agrega todas as verificações num único status (bom para exigir
# como check obrigatório em branch protection). `🔥 Release smoke` constrói a
# release de produção e confirma que ela sobe SEM nenhuma variável de ambiente;
# `🐳 Docker smoke` faz o mesmo com a imagem, do jeito que o docker-compose.yml a roda.
# A publicação (tarball e imagem Docker) é do workflow release.yml, em tags v*.
#
#   push/dispatch (main):  deps → [format, compile, credo, audit, test] → gate → [smoke, docker]
#   pull_request (main):   deps → [format, compile, credo, audit, test] → gate   (sem smoke)

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.4"

jobs:
  # ── 📦 Aquece o cache de deps/_build para os jobs seguintes ─────────────────
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Compilar dependências
        run: mix deps.compile

  # ── 🎨 Formatação ───────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix format --check-formatted

  # ── 🔨 Compilação sem warnings ───────────────────────────────────────────────
  compile:
    name: Compile (warnings as errors)
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix compile --force --warnings-as-errors

  # ── 🔎 Análise estática ──────────────────────────────────────────────────────
  credo:
    name: Credo
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix credo --strict

  # ── 🛡️ Dependências: travadas e sem CVEs ──────────────────────────────────────
  audit:
    name: Deps audit
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Sem dependências não usadas no lock
        run: mix deps.unlock --check-unused
      - name: Scan de vulnerabilidades
        run: mix deps.audit

  # ── 🧪 Testes + piso de cobertura ─────────────────────────────────────────────
  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Roda a suíte E aplica o piso de cobertura (minimum_coverage em coveralls.json).
      - run: mix coveralls

  # ── ✅ Status agregado do quality gate ────────────────────────────────────────
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [format, compile, credo, audit, test]
    steps:
      - name: Todas as verificações passaram
        run: echo "✅ format + compile + credo + audit + test — quality gate verde."

  # ── 🔥 Release smoke ──────────────────────────────────────────────────────────
  # Constrói a release de PRODUÇÃO e a sobe sem nenhuma variável de ambiente (só o
  # DATA_DIR, num diretório temporário): confirma que o boot gera os segredos, migra
  # o banco, responde em /health, imprime o código do setup no log e que a
  # instância sem dono redireciona o app para /setup (a landing em / é pública).
  #
  # Só roda fora de PR para não consumir minutos desnecessariamente em branches.
  release-smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    needs: quality_gate
    if: github.event_name != 'pull_request'
    env:
      MIX_ENV: prod
      PORT: "4002"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Compilar assets e release de produção
        run: |
          mix assets.deploy
          mix release --overwrite

      - name: Subir app em background (sem variáveis, só DATA_DIR)
        run: |
          mkdir -p "$RUNNER_TEMP/grana-smoke"
          DATA_DIR="$RUNNER_TEMP/grana-smoke" PHX_SERVER=true \
            _build/prod/rel/grana/bin/grana start > "$RUNNER_TEMP/grana.log" 2>&1 &

      - name: Aguardar /health (até 40 s)
        run: |
          for i in $(seq 1 20); do
            echo "Tentativa $i/20..."
            if curl -sf --max-time 3 http://localhost:4002/health | grep -q '"status":"ok"'; then
              echo "✅ /health respondeu."
              exit 0
            fi
            sleep 2
          done
          echo "❌ App não subiu no prazo de 40 s."
          cat "$RUNNER_TEMP/grana.log" || true
          exit 1

      - name: O log tem o código do setup
        run: |
          grep -E "Código: [A-Z0-9]{4}-[A-Z0-9]{4}" "$RUNNER_TEMP/grana.log"

      - name: Segredos gerados e banco migrado
        run: |
          test -s "$RUNNER_TEMP/grana-smoke/secrets/secret_key_base"
          test -s "$RUNNER_TEMP/grana-smoke/secrets/cloak_key"
          test -s "$RUNNER_TEMP/grana-smoke/grana.db"

      - name: Sem dono, o app redireciona para /setup
        run: |
          curl -si --max-time 5 http://localhost:4002/dashboard | tr -d '\r' | grep -iE '^location: .*/setup$'

      # Como atrás de um proxy HTTPS: com PUBLIC_URL em https a release sobe, e o socket do
      # LiveView aceita a origem https (o esquema vem do X-Forwarded-Proto).
      - name: Atrás de proxy HTTPS, sobe e o LiveView conecta
        run: |
          PID=$(DATA_DIR="$RUNNER_TEMP/grana-smoke" _build/prod/rel/grana/bin/grana pid)
          DATA_DIR="$RUNNER_TEMP/grana-smoke" _build/prod/rel/grana/bin/grana stop
          for i in $(seq 1 30); do
            kill -0 "$PID" 2> /dev/null || break
            sleep 1
          done
          DATA_DIR="$RUNNER_TEMP/grana-smoke" PHX_SERVER=true TRUST_PROXY_HEADERS=true \
            PUBLIC_URL=https://grana.example.com \
            _build/prod/rel/grana/bin/grana start > "$RUNNER_TEMP/grana-https.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf --max-time 3 http://localhost:4002/health > /dev/null && break
            sleep 2
          done
          curl -s --max-time 5 -H "Host: grana.example.com" -H "X-Forwarded-Proto: https" \
            -H "Origin: https://grana.example.com" "http://localhost:4002/live/longpoll?vsn=2.0.0" \
            | grep -q '"status":410' || { cat "$RUNNER_TEMP/grana-https.log"; exit 1; }

      # A demonstração pública: numa pasta vazia, o boot cria a conta fictícia, a landing
      # oferece a demo e o login, com o acesso à vista, entra nela.
      - name: Modo demonstração sobe com a conta fictícia
        run: |
          PID=$(DATA_DIR="$RUNNER_TEMP/grana-smoke" _build/prod/rel/grana/bin/grana pid)
          DATA_DIR="$RUNNER_TEMP/grana-smoke" _build/prod/rel/grana/bin/grana stop
          for i in $(seq 1 30); do
            kill -0 "$PID" 2> /dev/null || break
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/grana-demo"
          DATA_DIR="$RUNNER_TEMP/grana-demo" PHX_SERVER=true GRANA_DEMO=true \
            _build/prod/rel/grana/bin/grana start > "$RUNNER_TEMP/grana-demo.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf --max-time 3 http://localhost:4002/health > /dev/null && break
            sleep 2
          done
          curl -s --max-time 5 http://localhost:4002/ | grep -q 'id="hero-demo"' \
            || { cat "$RUNNER_TEMP/grana-demo.log"; exit 1; }
          JAR="$RUNNER_TEMP/grana-demo.cookies"
          LOGIN=$(curl -s --max-time 5 -c "$JAR" http://localhost:4002/users/log-in)
          echo "$LOGIN" | grep -q 'id="demo-credentials"' \
            || { cat "$RUNNER_TEMP/grana-demo.log"; exit 1; }
          CSRF=$(echo "$LOGIN" | grep -o 'name="csrf-token" content="[^"]*"' | cut -d'"' -f4)
          curl -si --max-time 10 -b "$JAR" http://localhost:4002/users/log-in \
            --data-urlencode "_csrf_token=$CSRF" \
            --data-urlencode "user[email]=demo@grana.local" \
            --data-urlencode "user[password]=demonstracao" | tr -d '\r' \
            | grep -iE '^location: .*/dashboard$' || { cat "$RUNNER_TEMP/grana-demo.log"; exit 1; }

      - name: Parar app
        if: always()
        run: |
          for dir in grana-demo grana-smoke; do
            DATA_DIR="$RUNNER_TEMP/$dir" _build/prod/rel/grana/bin/grana stop || true
          done

  # ── 🐳 Docker smoke ─────────────────────────────────────────────────────────
  # Constrói a imagem (só amd64) e a sobe com as mesmas restrições do docker-compose.yml:
  # confirma o boot sem variáveis, o código do setup no log, o portão do setup, o
  # HEALTHCHECK da imagem e os comandos de manutenção do README (Docker e Fly.io).
  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    needs: quality_gate
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grana:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir como o compose (read-only, sem capabilities)
        run: |
          docker run -d --name grana -p 127.0.0.1:4000:4000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --init -v grana-data:/data grana:smoke

      - name: Aguardar /health (até 60 s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://localhost:4000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs grana
          exit 1

      - name: O log tem o código do setup
        run: |
          docker logs grana 2>&1 | grep -E "Código: [A-Z0-9]{4}-[A-Z0-9]{4}"

      - name: Sem dono, o app redireciona para /setup
        run: |
          curl -si --max-time 5 http://localhost:4000/dashboard | tr -d '\r' | grep -iE '^location: .*/setup$'

      - name: O HEALTHCHECK da imagem fica healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' grana)" = healthy ] && exit 0
            sleep 3
          done
          docker inspect -f '{{json .State.Health}}' grana
          exit 1

      - name: Comando de senha do README, no Docker
        run: docker exec grana /app/bin/grana-reset-password | grep "ainda não tem dono"

      # O `fly ssh console` entra como root e pode não trazer o ENV da imagem: o comando do
      # README troca para o usuário do app e passa o DATA_DIR.
      - name: Comando de senha do README, no Fly.io
        run: |
          docker run --rm -u root --entrypoint sh -v grana-data:/data grana:smoke \
            -c "su -s /bin/sh grana -c 'DATA_DIR=/data /app/bin/grana-reset-password'" \
            | grep "ainda não tem dono"

      - name: Parar
        if: always()
        run: docker rm -f grana || true
